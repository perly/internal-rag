services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: internal_rag
      POSTGRES_PASSWORD: internal_rag
      POSTGRES_DB: internal_rag
    ports:
      - "5433:5432"
    volumes:
      - internal_rag_postgres:/var/lib/postgresql/data

volumes:
  internal_rag_postgres:
